services:
  - type: web
    name: central-game-auth
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: PAYMENT_MODE
        value: "test"
      - key: ALLOW_LIVE_PAYMENTS
        value: "false"
      - key: PAYU_KEY
        sync: false
      - key: PAYU_SALT
        sync: false
